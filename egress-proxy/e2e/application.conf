ktor {
  deployment {
    port = 7171
  }
  application {
    modules = [com.github.uncomplexco.sidekick.sandbox.service.SandboxServiceKt.module]
  }
}

sandbox {
  token = "e2e-token"
  bwrap-path = "bwrap"
  rootfs = "/rootfs"
  max-output-bytes = 262144
  uid = 65534
  gid = 65534
  allowed-source-prefixes = ["/work", "/data"]
}

egress {
  enabled = true
  listen-address = "127.0.0.1"
  port = 0
  state-dir = "/app/egress-state"
  default-action = deny
  enforce = ${?EGRESS_ENFORCE}

  credentials = [
    { ref = demo-token, value = ${?DEMO_TOKEN} }
  ]

  rules = [
    { id = httpbin, host = "httpbin.org", action = terminate,
      credential-ref = demo-token, header = "Authorization", value-template = "Bearer {{token}}" }
  ]
}
